<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>MooGe — Tecnologia para todos os animais</title>
    <meta
      name="description"
      content="Gestão de rebanho na web e app de campo conectado à balança e ao bastão leitor de chip, com fila offline para fazendas sem internet."
    />
    <meta name="theme-color" content="#f9f9fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="MooGe" />
    <meta property="og:title" content="MooGe — Tecnologia para todos os animais" />
    <meta
      property="og:description"
      content="Painel web do rebanho + app de campo com balança, bastão leitor e fila offline."
    />

    <meta property="og:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />

    <script>
      // Aplica o tema antes da primeira pintura para evitar flash.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* localStorage indisponível — segue no tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
